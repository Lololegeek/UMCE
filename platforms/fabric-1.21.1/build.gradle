plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.2'
}

base {
    archivesName = 'umce-fabric-1.21.1'
}

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.16.14'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'

    implementation project(':core')
    include project(':api')
    include project(':core')
    include 'com.google.code.gson:gson:2.13.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

loom {
    runs {
        server {
            server()
            runDir = 'build/server-run'
        }
    }
}

tasks.withType(JavaExec).configureEach {
    javaLauncher = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.named('jar') {
    archiveBaseName = 'umce-fabric-1.21.1'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD-PARTY-NOTICES.md'))
    from(rootProject.file('third-party/GSON-LICENSE.txt')) {
        into 'META-INF/licenses'
    }
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}
