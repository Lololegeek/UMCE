plugins {
    id 'application'
}

dependencies {
    implementation project(':api')
    implementation project(':core')
    implementation 'com.google.code.gson:gson:2.13.1'
}

application {
    mainClass = 'io.umce.cli.Umce'
}

tasks.named('jar') {
    manifest {
        attributes('Main-Class': application.mainClass.get())
    }
}
